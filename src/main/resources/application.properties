spring.application.name=trabalho.contabilidade.1

# Banco local persistente em arquivo. Não exige instalar ou iniciar um servidor de banco.
spring.datasource.url=jdbc:h2:file:./data/waldo;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Configure APP_BOOTSTRAP_SECRET no ambiente antes de criar o primeiro administrador.
app.bootstrap.secret=${APP_BOOTSTRAP_SECRET:}
